[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qw"
version = "0.1.0"
description = "Quantum well single-particle calculations"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
